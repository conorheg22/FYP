{% extends "base.html" %}

{% block content %}

<!--
  Join Household Page
  -------------------
  Allows a logged-in user to join an existing household using its invite code.
  On success:
    - Session active_household_id is set
    - User.active_household_id is persisted
-->

<div class="card homi p-4">

  <!-- Page title -->
  <h1 class="mb-4">Join a Household</h1>

  <!-- Invite Code Form -->
  <form method="POST">

    <div class="mb-3">
      <label for="invite_code" class="form-label">
        Enter Invite Code
      </label>
      <input
        type="text"
        name="invite_code"
        id="invite_code"
        class="form-control"
        required
      >
    </div>

    <!-- Submit button -->
    <button type="submit" class="btn btn-primary">
      Join
    </button>

  </form>

  <!--
    SUCCESS MESSAGE
    Displayed when backend passes `household`
  -->
  {% if household %}
    <div class="alert alert-success mt-4">
      <h5>Joined: {{ household.name }}</h5>

      {% if household.address %}
        <p class="mb-0">Address: {{ household.address }}</p>
      {% endif %}
    </div>
  {% endif %}

</div>

{% endblock %}
