{% extends "base.html" %}
{% block content %}
<div class="card homi p-4">
  <h1 class="mb-4">Create a Household</h1>

  <form method="POST">
    <div class="mb-3">
      <label for="name" class="form-label">Household Name</label>
      <input type="text" name="name" class="form-control" required>
    </div>
    <div class="mb-3">
      <label for="address" class="form-label">Address (optional)</label>
      <input type="text" name="address" class="form-control">
    </div>

    <!-- Create Button referenced from Bootstrap (2025) Buttons documentation -->
    <button type="submit" class="btn btn-primary">Create Household</button>
  </form>
</div>
{% endblock %}
