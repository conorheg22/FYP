{% extends "base.html" %}

{% block content %}

<!--
  Card container for the Create Household page.
  - Uses Bootstrap card styling
  - The .homi class applies custom theme colours
-->
<div class="card homi p-4">

  <!-- Page heading -->
  <h1 class="mb-4">Create a Household</h1>

  <!--
    Form to create a new household.
    - Submits via POST to the same route (main.create_household)
    - Backend generates an invite code
    - Household is saved and linked to the logged-in user
  -->
  <form method="POST">

    <!-- Household name input (required) -->
    <div class="mb-3">
      <label for="name" class="form-label">Household Name</label>
      <input
        type="text"
        name="name"
        id="name"
        class="form-control"
        required
      >
    </div>

    <!-- Optional address input -->
    <div class="mb-3">
      <label for="address" class="form-label">Address (optional)</label>
      <input
        type="text"
        name="address"
        id="address"
        class="form-control"
      >
    </div>

    <!-- Form submit button -->
    <button type="submit" class="btn btn-primary">
      Create Household
    </button>

  </form>
</div>

{% endblock %}
