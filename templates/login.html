{% extends "base.html" %}

{% block title %}Log in · HOMI{% endblock %}

{% block content %}
<!-- Log-in form: email, password, and link to create an account. -->
<div class="container py-5 py-md-6">
  <div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-5">
      <div class="card homi homi-accent p-4 p-md-5 shadow-sm">
        <h1 class="h3 mb-2 text-center fw-bold">Log in to HOMI</h1>
        <p class="text-muted text-center mb-4">
          Enter your details to access your household dashboard.
        </p>

        <form method="POST" action="{{ url_for('main.login') }}">
          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input
              type="email"
              class="form-control"
              id="email"
              name="email"
              required
              placeholder="you@example.com"
            >
          </div>
          <div class="mb-4">
            <label for="password" class="form-label">Password</label>
            <input
              type="password"
              class="form-control"
              id="password"
              name="password"
              required
              placeholder="••••••••"
            >
          </div>
          <button type="submit" class="btn btn-primary btn-lg w-100">Log in</button>
        </form>

        <p class="text-center mt-4 mb-0 small text-muted">
          No account yet?
          <a href="{{ url_for('main.register') }}" class="fw-semibold">Create one free</a>
        </p>

        <p class="text-center mt-3 mb-0 small text-muted">
          <i class="bi bi-shield-check text-success me-1"></i> Your data is secure and never shared.
        </p>
      </div>
    </div>
  </div>
</div>

{% endblock %}
