<!doctype html>
<!-- Main layout used by every page -->
<html lang="en">
  <head>
    <!-- Basic setup for the page -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HOMI — Making Shared Living Simple</title>

    <!-- Links to Bootstrap (styling), my custom CSS, and Google Fonts -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/site.css') }}" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>

  <body>
    <!-- HEADER / NAVBAR -->
    <!-- Reference: Hegarty, C. (2024) Header and Footer Design — IS3312 Project Phase 1.
     Unpublished student project, University College Cork.
     The header and footer HTML structures were adapted from this previous project. -->
    <header class="homi">
      <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
          <!-- Brand (logo and text) -->
          <a class="navbar-brand d-flex align-items-center brand" href="{{ url_for('main.index') }}">
            <img src="{{ url_for('static', filename='img/homi-logo.png') }}" alt="HOMI Logo">
            <span class="fw-bold">HOMI</span>
          </a>

          <!-- Mobile toggle button for small screens -->
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
          </button>

          <!-- Navigation Links -->
          <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
            <ul class="navbar-nav align-items-center">
              <!-- Home link -->
              <li class="nav-item">
                <a class="nav-link {% if request.path == '/' %}active{% endif %}" href="{{ url_for('main.index') }}">Home</a>
              </li>

              <!-- Chores link -->
              <li class="nav-item">
                <a class="nav-link {% if request.path.startswith('/db-test') %}active{% endif %}" href="{{ url_for('main.db_test_list') }}">Chores</a>
              </li>

              <!-- Household dropdown menu -->
              <li class="nav-item dropdown">
                <a class="nav-link dropdown-toggle" href="#" id="householdDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                  Household
                </a>
                <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="householdDropdown">
                  <li><a class="dropdown-item" href="{{ url_for('main.create_household') }}">Create Household</a></li>
                  <li><a class="dropdown-item" href="{{ url_for('main.join_household') }}">Join Household</a></li>
                </ul>
              </li>
            </ul>
          </div>
        </div>
      </nav>
    </header>

    <!-- MAIN CONTENT AREA -->
    <main class="container my-4">
      {% block content %}{% endblock %}
      <!-- Each page adds its own content here -->
    </main>

    <!-- FOOTER -->
    <!-- Reference: Hegarty, C. (2024) Header and Footer Design — IS3312 Project Phase 1.
     Unpublished student project, University College Cork.
     The header and footer HTML structures were adapted from this previous project. -->
    <footer class="homi text-center py-3">
      <small>© 2025 HOMI — Making Shared Living Simple</small>
    </footer>

    <!-- Bootstrap JavaScript for interactive features -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
