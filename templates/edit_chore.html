{% extends "base.html" %}
{% block content %}

<div class="homi-shell">
  <div class="homi-container">

    <div class="page-header">
      <h1 class="homi-title" style="font-size: 2rem;">Edit Chore</h1>
      <p class="homi-subtitle">Update the title and due date.</p>
    </div>

    <div class="card homi p-4 content-medium">
      <h2 class="homi-card-title">Edit chore</h2>

      <form method="POST" class="homi-form">
        <div class="homi-field">
          <label class="homi-label">Title</label>
          <input
            type="text"
            name="title"
            class="homi-input"
            value="{{ chore.title }}"
            required
          >
        </div>

        <div class="homi-field">
          <label class="homi-label">Due date (optional)</label>
          <input
            type="date"
            name="due_date"
            class="homi-input"
            value="{{ chore.due_date.strftime('%Y-%m-%d') if chore.due_date }}"
          >
        </div>

        <div class="homi-field">
          <label class="homi-label">Repeat</label>
          <select name="repeat_type" class="homi-input">
            <option value="none" {{ 'selected' if (chore.repeat_type|default('none')) == 'none' }}>None</option>
            <option value="daily" {{ 'selected' if (chore.repeat_type|default('')) == 'daily' }}>Daily</option>
            <option value="weekly" {{ 'selected' if (chore.repeat_type|default('')) == 'weekly' }}>Weekly</option>
            <option value="monthly" {{ 'selected' if (chore.repeat_type|default('')) == 'monthly' }}>Monthly</option>
          </select>
        </div>

        <div class="homi-field">
          <label class="homi-label">Estimated time (minutes, optional)</label>
          <input
            type="number"
            name="estimated_minutes"
            class="homi-input"
            min="0"
            value="{{ chore.estimated_minutes if chore.estimated_minutes is not none else '' }}"
            placeholder="e.g. 20"
          >
        </div>

        <div class="homi-actions">
          <button type="submit" class="homi-btn homi-btn-primary">Save changes</button>
          <a href="{{ url_for('main.db_test_list') }}" class="homi-btn homi-btn-ghost">Cancel</a>
        </div>
      </form>
    </div>

  </div>
</div>

{% endblock %}
