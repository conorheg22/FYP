{% extends "base.html" %}
{% block title %}Create account · HOMI{% endblock %}

{% block content %}

<div class="container py-5 py-md-6">
  <div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-5">
      <div class="card homi homi-accent p-4 p-md-5 shadow-sm">
        <h1 class="h3 mb-2 text-center fw-bold">Create your account</h1>
        <p class="text-muted text-center mb-4">
          Get started in under a minute. Free for small households.
        </p>

        <form method="POST" action="{{ url_for('main.register') }}">
          <div class="mb-3">
            <label for="name" class="form-label">Name</label>
            <input type="text" class="form-control" id="name" name="name" value="{{ name or '' }}" required placeholder="Your name">
          </div>
          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" name="email" value="{{ email or '' }}" required placeholder="you@example.com">
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" name="password" required minlength="8" autocomplete="new-password" placeholder="At least 8 characters">
            <div class="form-text">Minimum 8 characters</div>
          </div>
          <div class="mb-4">
            <label for="confirm_password" class="form-label">Confirm password</label>
            <input type="password" class="form-control" id="confirm_password" name="confirm_password" required minlength="8" autocomplete="new-password" placeholder="Same as above">
          </div>
          <button type="submit" class="btn btn-primary btn-lg w-100">Create account</button>
        </form>

        <p class="text-center mt-4 mb-0 small text-muted">
          Already have an account?
          <a href="{{ url_for('main.login') }}" class="fw-semibold">Log in</a>
        </p>

        <p class="text-center mt-3 mb-0 small text-muted">
          <i class="bi bi-shield-check text-success me-1"></i> Your data is secure and never shared.
        </p>
      </div>
    </div>
  </div>
</div>

{% endblock %}
